<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9482"/>
      <stop offset="100%" style="stop-color:#2a5c4e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="512" height="512" rx="110" fill="url(#shine)"/>

  <!-- Subtle pattern ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.12"/>
  <circle cx="256" cy="256" r="175" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Inner card -->
  <rect x="88" y="88" width="336" height="336" rx="72" fill="#ffffff" fill-opacity="0.10"/>

  <!-- Letter ض -->
  <text
    x="256"
    y="305"
    text-anchor="middle"
    font-family="Tahoma, Arial, sans-serif"
    font-size="220"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="-4"
  >ض</text>

  <!-- Thin gold accent line at bottom -->
  <rect x="176" y="370" width="160" height="5" rx="2.5" fill="#c9a96e" fill-opacity="0.85"/>
</svg>
